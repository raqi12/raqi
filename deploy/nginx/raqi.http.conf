# First-boot / no-SSL nginx config for a fresh VPS.
# Use this until Certbot issues certificates, then switch to raqi.conf.example.
#
# Install:
#   cp deploy/nginx/raqi.http.conf /etc/nginx/sites-available/raqi
#   ln -sf /etc/nginx/sites-available/raqi /etc/nginx/sites-enabled/raqi
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream raqi_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name api.raqii.com.ly;

  location /socket.io/ {
    proxy_pass http://raqi_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://raqi_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}

server {
  listen 80;
  server_name dashboard.raqii.com.ly;

  root /var/www/raqi/admin;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /socket.io/ {
    proxy_pass http://raqi_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://raqi_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /uploads/ {
    proxy_pass http://raqi_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
